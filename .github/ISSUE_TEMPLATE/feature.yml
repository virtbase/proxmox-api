name: Feature request
description: Suggest a change to the client or the generator.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Endpoint coverage is generated from the schema Proxmox publishes, so a
        missing endpoint is usually a regeneration rather than a feature —
        please open a bug for those instead.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward or impossible today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Sketch the API if you have one in mind.
    validations:
      required: false
