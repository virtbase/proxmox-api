name: Schema drift

# Proxmox updates its published schema in place, with no version to pin. This
# checks whether the committed model and endpoint reference still match what
# upstream serves.
#
# Deliberately not part of the docs or PR builds: an upstream change is not a
# reason to fail somebody's unrelated pull request. It surfaces here instead,
# where the fix is to run `bun run codegen` and commit the result.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run codegen:check
