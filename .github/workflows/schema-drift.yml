name: Schema drift

# Proxmox updates its published API schema in place, with no version to pin.
# This regenerates against upstream and opens a pull request when the result
# differs from what is committed.
#
# Deliberately not part of CI: an upstream change is not a reason to fail
# somebody's unrelated pull request. It surfaces here as a reviewable diff
# instead, which is also where the endpoint churn becomes visible.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Regenerate from the current upstream schema
        run: bun run codegen

      - name: Verify the regenerated model
        run: |
          bun run typecheck
          bun run test
          bun run build
          bun run lint:package
          # The endpoint reference is regenerated too, and a description
          # carrying new markup can break the docs build on its own.
          bun run docs:build

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/schema-drift
          # `feat!` so release-please treats an upstream API change as the
          # breaking change it is: endpoints can disappear between releases.
          commit-message: |
            feat!: regenerate API model from the current Proxmox schema

            Regenerated by the schema-drift workflow.
          title: "feat!: regenerate API model from the current Proxmox schema"
          body: |
            The Proxmox API schema upstream no longer matches the committed
            model and endpoint reference.

            Review the diff for **removed** endpoints and narrowed types before
            merging - those are breaking for consumers. Added endpoints and
            widened types are additive.

            Generated by `.github/workflows/schema-drift.yml`.
          labels: automated, codegen
          delete-branch: true
