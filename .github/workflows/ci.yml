name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check:ci
      - run: bun run typecheck
      - run: bun run lint:docs
      - run: bun run lint:knip
      - run: bun run lint:sherif
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: medium

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run codegen:check
      - run: bun run build
      - run: bun run lint:publint

  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=bun.lock
            --config=osv-scanner.toml

  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: |
          cat > "$RUNNER_TEMP/probe.ts" <<'PROBE'
          import { downloadApidoc, listVersions } from "./packages/generator/src/apt.ts";
          import { readLock } from "./packages/generator/src/load-schema.ts";
          const lock = await readLock();
          let started = Date.now();
          const versions = await listVersions(lock);
          console.log(`index: ${versions.length} versions in ${Date.now() - started} ms`);
          started = Date.now();
          const { apidoc, released } = await downloadApidoc({
            version: lock.version,
            filename: lock.filename,
            sha256: lock.debSha256,
          });
          console.log(`package: ${apidoc.length} bytes, ${released}, in ${Date.now() - started} ms`);
          PROBE
          cp "$RUNNER_TEMP/probe.ts" probe.ts
          bun probe.ts

  required:
    if: always()
    needs: [static, test, build, osv]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi
