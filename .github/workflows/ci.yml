name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # Split rather than chained so a failure names which gate broke.
      - name: Lint and format
        run: bun run check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

      # The published shape - exports map, types resolution, file list - is not
      # covered by typecheck, and is only observable once the package is packed.
      - name: Validate package
        run: bun run lint:package

  commits:
    # The version bump and the changelog are derived from commit subjects, so a
    # malformed one is a release bug rather than a style nit. Pull requests
    # only: the merge queue re-checks nothing new, and direct pushes to the
    # default branch have no range to check against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check commit messages
        run: >
          bun commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
